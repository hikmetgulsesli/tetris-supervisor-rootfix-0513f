<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tetris Supervisor - Main Menu</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary": "#233144",
                    "surface-variant": "#353436",
                    "surface": "#131315",
                    "on-surface-variant": "#c6c6cd",
                    "on-primary-container": "#798098",
                    "surface-tint": "#bec6e0",
                    "tertiary-container": "#231500",
                    "secondary-container": "#3c4a5e",
                    "on-error-container": "#ffdad6",
                    "surface-dim": "#131315",
                    "inverse-surface": "#e4e2e4",
                    "on-tertiary": "#3e2d11",
                    "on-surface": "#e4e2e4",
                    "on-tertiary-container": "#957d5a",
                    "tertiary-fixed-dim": "#dec29a",
                    "error": "#ffb4ab",
                    "outline-variant": "#45464d",
                    "on-tertiary-fixed": "#271901",
                    "on-secondary-fixed": "#0d1c2f",
                    "surface-container-highest": "#353436",
                    "secondary-fixed-dim": "#b9c7e0",
                    "primary-container": "#0f172a",
                    "on-primary-fixed-variant": "#3f465c",
                    "surface-bright": "#39393b",
                    "inverse-primary": "#565e74",
                    "tertiary-fixed": "#fcdeb5",
                    "secondary": "#b9c7e0",
                    "on-secondary-container": "#abb9d2",
                    "surface-container-low": "#1b1b1d",
                    "background": "#131315",
                    "on-error": "#690005",
                    "inverse-on-surface": "#303032",
                    "secondary-fixed": "#d5e3fd",
                    "on-background": "#e4e2e4",
                    "primary": "#bec6e0",
                    "outline": "#909097",
                    "primary-fixed-dim": "#bec6e0",
                    "tertiary": "#dec29a",
                    "on-tertiary-fixed-variant": "#574425",
                    "error-container": "#93000a",
                    "on-secondary-fixed-variant": "#3a485c",
                    "primary-fixed": "#dae2fd",
                    "on-primary": "#283044",
                    "surface-container-lowest": "#0e0e10",
                    "on-primary-fixed": "#131b2e",
                    "surface-container": "#1f1f21",
                    "surface-container-high": "#2a2a2b"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "grid-gutter": "16px",
                    "container-padding": "24px",
                    "touch-target-min": "44px",
                    "block-size": "32px",
                    "unit": "4px"
            },
            "fontFamily": {
                    "body-base": [
                            "Hanken Grotesk"
                    ],
                    "button-text": [
                            "Hanken Grotesk"
                    ],
                    "hud-label": [
                            "JetBrains Mono"
                    ],
                    "hud-value": [
                            "Hanken Grotesk"
                    ],
                    "display-score": [
                            "Hanken Grotesk"
                    ],
                    "headline-lg": [
                            "Hanken Grotesk"
                    ]
            },
            "fontSize": {
                    "body-base": [
                            "16px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "400"
                            }
                    ],
                    "button-text": [
                            "14px",
                            {
                                    "lineHeight": "20px",
                                    "fontWeight": "600"
                            }
                    ],
                    "hud-label": [
                            "12px",
                            {
                                    "lineHeight": "16px",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "500"
                            }
                    ],
                    "hud-value": [
                            "24px",
                            {
                                    "lineHeight": "32px",
                                    "fontWeight": "600"
                            }
                    ],
                    "display-score": [
                            "48px",
                            {
                                    "lineHeight": "1",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "800"
                            }
                    ],
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "1.2",
                                    "fontWeight": "700"
                            }
                    ]
            }
          },
        }
      }
    </script>
<style>
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(51, 65, 85, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(51, 65, 85, 0.2) 1px, transparent 1px);
            background-size: 32px 32px;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-base h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative bg-grid-pattern">
<!-- Ambient Glow / Vignette -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-transparent via-background/80 to-background pointer-events-none z-0"></div>
<!-- Main Content Container -->
<div class="relative z-10 flex flex-col items-center justify-center w-full max-w-lg px-container-padding">
<!-- Header / Brand Area -->
<div class="mb-12 text-center flex flex-col items-center gap-2">
<!-- Glitch / Offset Text Effect container -->
<div class="relative inline-block">
<h1 class="font-display-score text-display-score text-on-surface uppercase tracking-tighter drop-shadow-[0_0_8px_rgba(190,198,224,0.3)]">
                    TETRIS SUPERVISOR
                </h1>
</div>
<div class="inline-flex items-center gap-2 px-3 py-1 border border-outline-variant rounded bg-surface-container-low/50 backdrop-blur-sm">
<span class="material-symbols-outlined text-primary text-[14px]">terminal</span>
<span class="font-hud-label text-hud-label text-primary uppercase">ROOT FIX 0513f</span>
</div>
</div>
<!-- Menu Navigation -->
<nav class="flex flex-col gap-unit w-full max-w-xs">
<!-- START GAME Button (Primary Focus) -->
<button class="group relative w-full flex items-center justify-between px-6 py-4 border border-outline-variant bg-surface/50 hover:bg-primary/10 hover:border-primary focus:outline focus:outline-2 focus:outline-white focus:outline-offset-2 transition-all duration-200 active:scale-95 rounded-DEFAULT backdrop-blur-md">
<div class="absolute inset-0 opacity-0 group-hover:opacity-100 group-focus:opacity-100 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary/20 to-transparent transition-opacity duration-300 pointer-events-none"></div>
<span class="font-button-text text-button-text text-on-surface group-hover:text-primary transition-colors tracking-wide uppercase">START GAME</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">play_arrow</span>
</button>
<!-- OPTIONS Button -->
<button class="group relative w-full flex items-center justify-between px-6 py-4 border border-outline-variant bg-surface/50 hover:bg-primary/10 hover:border-primary focus:outline focus:outline-2 focus:outline-white focus:outline-offset-2 transition-all duration-200 active:scale-95 rounded-DEFAULT backdrop-blur-md mt-2">
<span class="font-button-text text-button-text text-on-surface group-hover:text-primary transition-colors tracking-wide uppercase">OPTIONS</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">settings</span>
</button>
<!-- CONTROLS Button -->
<button class="group relative w-full flex items-center justify-between px-6 py-4 border border-outline-variant bg-surface/50 hover:bg-primary/10 hover:border-primary focus:outline focus:outline-2 focus:outline-white focus:outline-offset-2 transition-all duration-200 active:scale-95 rounded-DEFAULT backdrop-blur-md mt-2">
<span class="font-button-text text-button-text text-on-surface group-hover:text-primary transition-colors tracking-wide uppercase">CONTROLS</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">gamepad</span>
</button>
<!-- QUIT Button -->
<button class="group relative w-full flex items-center justify-between px-6 py-4 border border-outline-variant bg-surface/50 hover:bg-error/10 hover:border-error focus:outline focus:outline-2 focus:outline-white focus:outline-offset-2 transition-all duration-200 active:scale-95 rounded-DEFAULT backdrop-blur-md mt-6">
<span class="font-button-text text-button-text text-on-surface group-hover:text-error transition-colors tracking-wide uppercase">QUIT</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-error transition-colors">power_settings_new</span>
</button>
</nav>
<!-- Footer Meta Data -->
<div class="absolute bottom-container-padding w-full flex justify-between items-center px-container-padding max-w-lg z-10 pointer-events-none">
<span class="font-hud-label text-[10px] text-on-surface-variant/50">SYS.VER: 1.0.42</span>
<div class="flex gap-1">
<div class="w-2 h-2 bg-primary rounded-full animate-pulse"></div>
<div class="w-2 h-2 bg-on-surface-variant/30 rounded-full"></div>
<div class="w-2 h-2 bg-on-surface-variant/30 rounded-full"></div>
</div>
<span class="font-hud-label text-[10px] text-on-surface-variant/50">NODE: ONLINE</span>
</div>
</div>
</body></html>
