<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Game Over</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary": "#233144",
                      "surface-variant": "#353436",
                      "surface": "#131315",
                      "on-surface-variant": "#c6c6cd",
                      "on-primary-container": "#798098",
                      "surface-tint": "#bec6e0",
                      "tertiary-container": "#231500",
                      "secondary-container": "#3c4a5e",
                      "on-error-container": "#ffdad6",
                      "surface-dim": "#131315",
                      "inverse-surface": "#e4e2e4",
                      "on-tertiary": "#3e2d11",
                      "on-surface": "#e4e2e4",
                      "on-tertiary-container": "#957d5a",
                      "tertiary-fixed-dim": "#dec29a",
                      "error": "#ffb4ab",
                      "outline-variant": "#45464d",
                      "on-tertiary-fixed": "#271901",
                      "on-secondary-fixed": "#0d1c2f",
                      "surface-container-highest": "#353436",
                      "secondary-fixed-dim": "#b9c7e0",
                      "primary-container": "#0f172a",
                      "on-primary-fixed-variant": "#3f465c",
                      "surface-bright": "#39393b",
                      "inverse-primary": "#565e74",
                      "tertiary-fixed": "#fcdeb5",
                      "secondary": "#b9c7e0",
                      "on-secondary-container": "#abb9d2",
                      "surface-container-low": "#1b1b1d",
                      "background": "#131315",
                      "on-error": "#690005",
                      "inverse-on-surface": "#303032",
                      "secondary-fixed": "#d5e3fd",
                      "on-background": "#e4e2e4",
                      "primary": "#bec6e0",
                      "outline": "#909097",
                      "primary-fixed-dim": "#bec6e0",
                      "tertiary": "#dec29a",
                      "on-tertiary-fixed-variant": "#574425",
                      "error-container": "#93000a",
                      "on-secondary-fixed-variant": "#3a485c",
                      "primary-fixed": "#dae2fd",
                      "on-primary": "#283044",
                      "surface-container-lowest": "#0e0e10",
                      "on-primary-fixed": "#131b2e",
                      "surface-container": "#1f1f21",
                      "surface-container-high": "#2a2a2b"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "grid-gutter": "16px",
                      "container-padding": "24px",
                      "touch-target-min": "44px",
                      "block-size": "32px",
                      "unit": "4px"
              },
              "fontFamily": {
                      "body-base": [
                              "Hanken Grotesk"
                      ],
                      "button-text": [
                              "Hanken Grotesk"
                      ],
                      "hud-label": [
                              "JetBrains Mono"
                      ],
                      "hud-value": [
                              "Hanken Grotesk"
                      ],
                      "display-score": [
                              "Hanken Grotesk"
                      ],
                      "headline-lg": [
                              "Hanken Grotesk"
                      ]
              },
              "fontSize": {
                      "body-base": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "button-text": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "600"
                              }
                      ],
                      "hud-label": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "500"
                              }
                      ],
                      "hud-value": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "600"
                              }
                      ],
                      "display-score": [
                              "48px",
                              {
                                      "lineHeight": "1",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "800"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "1.2",
                                      "fontWeight": "700"
                              }
                      ]
              }
      },
          },
        }
      </script>
</head>
<body class="bg-background text-on-background min-h-screen font-body-base selection:bg-primary selection:text-on-primary flex items-center justify-center p-container-padding relative overflow-hidden">
<!-- Background Grid Decoration (Simulating paused game well behind modal) -->
<div class="fixed inset-0 pointer-events-none z-0 opacity-20 bg-[linear-gradient(to_right,#334155_1px,transparent_1px),linear-gradient(to_bottom,#334155_1px,transparent_1px)] bg-[size:32px_32px]"></div>
<!-- Radial blur overlay to simulate depth -->
<div class="fixed inset-0 bg-background/80 backdrop-blur-[12px] z-10 pointer-events-none"></div>
<!-- Game Over Modal (Canvas) -->
<main class="relative z-20 w-full max-w-[480px] bg-surface border border-outline-variant flex flex-col items-stretch p-8 md:p-12 rounded-none shadow-[0_0_80px_rgba(0,0,0,0.8)] before:absolute before:-inset-[1px] before:border before:border-primary/20 before:-z-10 before:translate-x-[4px] before:translate-y-[4px] before:rounded-none">
<!-- Header -->
<header class="text-center mb-8 flex flex-col items-center">
<!-- Simulated glowing scanline effect on text -->
<h1 class="font-display-score text-display-score text-error uppercase relative inline-block drop-shadow-[0_0_12px_rgba(255,180,171,0.4)]">
                GAME OVER
            </h1>
</header>
<!-- High Score Badge -->
<div class="flex justify-center mb-8">
<span class="inline-flex items-center gap-2 bg-tertiary text-on-tertiary font-hud-label text-hud-label px-4 py-2 uppercase tracking-widest relative overflow-hidden group border border-tertiary shadow-[0_0_16px_rgba(222,194,154,0.3)]">
<span class="material-symbols-outlined text-[16px] animate-pulse">trophy</span>
                New High Score!
                <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/30 to-transparent -translate-x-full animate-[shimmer_2s_infinite]"></div>
</span>
</div>
<!-- HUD Stats Module -->
<section class="flex flex-col mb-10 border border-outline-variant bg-surface-container-low p-6 rounded-none relative">
<div class="absolute -top-3 left-4 bg-surface px-2 font-hud-label text-hud-label text-on-surface-variant uppercase">Session Log</div>
<div class="flex flex-col gap-4 mt-2">
<!-- Stat Row 1 -->
<div class="flex justify-between items-baseline border-b border-outline-variant/30 pb-3">
<span class="font-hud-label text-hud-label text-on-surface-variant uppercase">Final Score</span>
<span class="font-hud-value text-hud-value text-primary drop-shadow-[0_0_8px_rgba(190,198,224,0.3)]">45,200</span>
</div>
<!-- Stat Row 2 -->
<div class="flex justify-between items-baseline border-b border-outline-variant/30 pb-3">
<span class="font-hud-label text-hud-label text-on-surface-variant uppercase">Lines Cleared</span>
<span class="font-hud-value text-hud-value text-on-surface">142</span>
</div>
<!-- Stat Row 3 -->
<div class="flex justify-between items-baseline">
<span class="font-hud-label text-hud-label text-on-surface-variant uppercase">Level Reached</span>
<span class="font-hud-value text-hud-value text-on-surface">12</span>
</div>
</div>
</section>
<!-- Actions -->
<nav class="flex flex-col gap-4">
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary border border-primary font-button-text text-button-text py-4 uppercase tracking-[0.1em] hover:bg-surface hover:text-primary focus:outline focus:outline-2 focus:outline-primary focus:-outline-offset-4 transition-all active:bg-primary/20 rounded-none shadow-[inset_0_0_0_1px_rgba(255,255,255,0.2)] hover:shadow-[0_0_16px_rgba(190,198,224,0.4)] min-h-[touch-target-min]">
                Play Again
            </button>
<!-- Secondary Actions Row -->
<div class="flex gap-4">
<button class="flex-1 bg-transparent text-on-surface border border-outline-variant font-button-text text-button-text py-3 uppercase tracking-[0.1em] hover:border-primary hover:text-primary focus:outline focus:outline-2 focus:outline-outline focus:-outline-offset-2 transition-all active:bg-surface-container rounded-none min-h-[touch-target-min]">
                    Main Menu
                </button>
<button class="flex-1 bg-transparent text-on-surface border border-outline-variant font-button-text text-button-text py-3 uppercase tracking-[0.1em] hover:border-primary hover:text-primary flex items-center justify-center gap-2 focus:outline focus:outline-2 focus:outline-outline focus:-outline-offset-2 transition-all active:bg-surface-container rounded-none min-h-[touch-target-min]">
<span class="material-symbols-outlined text-[18px]">share</span>
                    Share
                </button>
</div>
</nav>
</main>
<style>
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
    </style>
</body></html>
